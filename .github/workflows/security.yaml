name: Security

on:
  push:
  pull_request:

jobs:

  security:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, json

      - name: Set project php-version
        run: |
          echo "${{ matrix.php }}" > .php-version

      - name: Determine composer cache directory
        id: composer-cache-directory
        run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies installed with composer
        uses: actions/cache@v3
        id: cache-composer
        with:
          path: ${{ steps.composer-cache-directory.outputs.directory }}
          key: composer2-php:${{ matrix.php }}-${{ github.sha }}
          restore-keys: composer2-php:${{ matrix.php }}-

      - name: Ensure that composer cache directory exists
        run: mkdir -p ${{ steps.composer-cache-directory.outputs.directory }}

      - name: Composer Github Auth
        run: composer config -g github-oauth.github.com ${{ github.token }}

      - name: Install PHP dependencies
        run: composer update --prefer-dist

      - uses: symfonycorp/security-checker-action@v5
        with:
            disable-exit-code: 1
        id: security-check

      - name: Filter vulnerabilities
        run: |
          echo '${{ steps.security-check.outputs.vulns }}' \
            | jq 'with_entries(
                    .value.advisories |= map(
                      select(.cve != "CVE-2025-31481" and .cve != "CVE-2025-31485")
                    )
                  )' \
            > filtered.json
          
          cat filtered.json
          
          # Compter les vulnérabilités restantes
          remaining=$(jq '[.[] | .advisories[]] | length' filtered.json)
          if [ "$remaining" -gt 0 ]; then
            echo "❌ Security issues found ($remaining remaining)"
            exit 1
          else
            echo "✅ No relevant security issues"
          fi
